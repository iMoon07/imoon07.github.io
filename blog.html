<!DOCTYPE html>
<html lang="en">


<head>
    <!-- ==========================================================================
     DAFTAR ARTIKEL / ARTICLE LISTING
     Halaman blog: filter, pagination, dan daftar artikel.
     The blog page: filters, pagination, and the article list.
     Data artikel diambil dari js/data.js lalu dimuat lewat js/main.js.
     ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raja Muhammad Kurnia Setyawan</title>
    
    <!-- Favicon & Social Share Image
         Ikon dan pratinjau kartu share.
         Favicon and the social card preview. -->
    <link rel="icon" type="image/jpeg" href="assets/logos.png">
    <meta property="og:title" content="Programmer">
    <meta property="og:description" content="Notes and explorations from a Programmer Cool">
    <meta property="og:image" content="https://imoon07.github.io/assets/logos.png">
    
    <!-- SEO Meta Tags
         Meta untuk mesin pencari dan pratinjau tautan.
         Meta tags for search engines and link previews. -->
    <meta name="description" content="Hi, I am Raja Muhammad Kurnia Setyawan (iMoon07). 21yo exploring Program, System, Networking, Cryptography, Information - Data. Personal portfolio and blog with cybersecurity, hacking, pentest, programming notes.">
    <meta name="author" content="Raja Muhammad Kurnia Setyawan">
    <meta name="robots" content="index, follow">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="css/shell.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="blog-page">
    <div class="site">
        <main class="blog-content page-pending">
            <div class="blog-head">
                <div class="blog-head-text">
                    <h1 class="blog-title" id="cat-title">Latest posts</h1>
                    <span class="blog-count" id="post-count"></span>
                </div>

                <div class="blog-search">
                    <svg class="blog-search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.6-3.6"></path></svg>
                    <input
                        type="search"
                        id="post-search"
                        class="blog-search-input"
                        placeholder="Search title"
                        aria-label="Search articles by title"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button type="button" class="blog-search-clear" id="search-clear" aria-label="Clear search" hidden>
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </button>
                </div>
            </div>

            <!-- FILTER + PAGINATION TETAP DI ATAS (sticky), hanya daftar artikel yang di-scroll
                 Filter dan pagination menempel di atas, daftar artikel yang digulir.
                 Filters and pagination stay on top, only the article list scrolls. -->
            <div class="blog-sticky">
                <div class="blog-filters">
                    <nav class="blog-filter-group" id="cat-nav-container" aria-label="Categories">
                        <!-- Categories rendered dynamically via JS
                             Kategori digambar dari metadata artikel.
                             Categories are drawn from the article metadata. -->
                    </nav>

                    <span class="blog-divider" aria-hidden="true"></span>

                    <nav class="blog-filter-group blog-tag-group" id="tag-nav-container" aria-label="Tags">
                        <!-- Tags rendered dynamically via JS
                             Tag digambar dari metadata artikel.
                             Tags are drawn from the article metadata. -->
                    </nav>
                </div>
            </div>

            <!-- Main Layout
                 Daftar artikel dan kolom samping.
                 The article list and the side column. -->
            <div class="main-layout">

                <!-- Left Column: Projects
                     Kartu artikel digambar oleh js/main.js.
                     The article cards are drawn by js/main.js. -->
                <div class="content-area" style="width: 100%;">
                    <div id="project-container">
                        <!-- Projects rendered dynamically via JS -->
            </div>

            <nav class="pagination" id="pagination" aria-label="Article pages" hidden>
                <button type="button" class="page-arrow" id="prevPage" aria-label="Previous page">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>
                </button>

                <div class="page-numbers" id="pageNumbers"></div>

                <button type="button" class="page-arrow" id="nextPage" aria-label="Next page">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"></path></svg>
                </button>

                <div class="page-indicator" id="pageIndicator">1 / 1</div>
            </nav>
                </div>

            </div>
        </main>

        <nav class="navigation" aria-label="Main navigation">
            <a class="nav-item" href="index.html">
                Home
                <span class="nav-arrow" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                </span>
            </a>

            <a class="nav-item" href="blog.html" aria-current="page">
                Blog
                <span class="nav-arrow" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                </span>
            </a>

            <a class="nav-item" href="index.html#about">
                About
                <span class="nav-arrow" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                </span>
            </a>
        </nav>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Global Lang State
        window.currentLang = 'en';

        /* FADE IN AFTER DATA IS READY
           Menunggu post selesai dimuat supaya tidak ada lompatan layout
           (tidak ada "besar lalu kecil") saat halaman dibuka. */
        (function () {
            const content = document.querySelector('.blog-content');
            let revealed = false;

            const reveal = () => {
                if (revealed) return;
                revealed = true;
                content.classList.remove('page-pending');
                content.classList.add('page-enter');
            };

            // Tunggu gambar yang terlihat di layar agar tidak melompat saat fade in
            const waitForImages = () => {
                const imgs = Array.from(document.querySelectorAll('#project-container img')).filter(img => {
                    const r = img.getBoundingClientRect();
                    return r.bottom > 0 && r.top < window.innerHeight * 1.5;
                });

                if (!imgs.length) return Promise.resolve();

                return Promise.all(imgs.map(img => {
                    if (img.complete && img.naturalWidth) return Promise.resolve();
                    return new Promise(resolve => {
                        img.addEventListener('load', resolve, { once: true });
                        img.addEventListener('error', resolve, { once: true });
                    });
                }));
            };

            const show = async () => {
                await waitForImages();
                reveal();
            };

            if (window.blogReady && typeof window.blogReady.then === 'function') {
                window.blogReady.then(show);
                // Jaring pengaman, jauh di atas timeout fetch (8 detik)
                setTimeout(show, 9000);
            } else {
                show();
            }
        })();

        /* PAGE TRANSITION — same opacity motion as home -> about */
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

        document.querySelectorAll('.navigation .nav-item[href^="index.html"]')
            .forEach(link => {
                link.addEventListener('click', event => {
                    event.preventDefault();

                    const content = document.querySelector('.blog-content');

                    content.classList.remove('page-enter');
                    content.classList.add('page-leave');

                    setTimeout(() => {
                        window.location.href = link.getAttribute('href');
                    }, reducedMotion.matches ? 0 : 180);
                });
            });
    </script>
</body>
</html>
